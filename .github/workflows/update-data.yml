
name: Mise à jour des données Licitor

on:
  schedule:
    # Exécution à 6h00 UTC (= 7h00 heure de Paris en hiver) tous les jours impairs du mois
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-licitor-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter le scraper
        run: python scripts/update_data.py

      - name: Enregistrer les Données visites
        run: |
          git add front/data/
          if git diff --cached --quiet; then
            echo "Aucune modification des données visites."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mise à jour automatique des données"
            git push origin HEAD:main
          fi

      - name: Enregistrer les Données ventes
        run: |
          git add historical_database/data/
          if git diff --cached --quiet; then
            echo "Aucune modification des données ventes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mise à jour automatique des données"
            git push origin HEAD:main
          fi

      - name: Enregistrer les Données Debug
        run: |
          git add tests/scrapper_debug/
          if git diff --cached --quiet; then
            echo "Aucune modification des données debug."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Mise à jour automatique des données"
            git push origin HEAD:main
          fi
