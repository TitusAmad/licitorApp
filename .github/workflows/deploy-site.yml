
name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy-site.yml'

  workflow_dispatch:

  workflow_run:
    workflows: ["Mise à jour des données Licitor"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: front

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
